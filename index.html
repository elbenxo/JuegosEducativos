<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juegos Educativos</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app">

        <!-- PANTALLA 1: BIENVENIDA -->
        <section id="screen-welcome" class="screen active">
            <div class="card">
                <h1 class="title">🎯 Juegos Educativos</h1>
                <p class="subtitle">¡Practica matemáticas y bate tu récord!</p>

                <label for="player-name" class="label">¿Cómo te llamas?</label>
                <input
                    type="text"
                    id="player-name"
                    class="name-input"
                    placeholder="Escribe tu nombre"
                    maxlength="20"
                    autocomplete="off"
                />

                <h2 class="section-heading">Elige tu juego</h2>

                <div class="game-cards">
                    <button class="game-card" data-game="sumas" type="button">
                        <span class="game-emoji">➕</span>
                        <span class="game-name">Sumas Rápidas</span>
                        <span class="game-desc">60 sumas en 2 minutos<br>Resultados hasta 10</span>
                    </button>

                    <button class="game-card" data-game="multi" type="button">
                        <span class="game-emoji">✖️</span>
                        <span class="game-name">Multiplicaciones Rápidas</span>
                        <span class="game-desc">40 multiplicaciones en 2 minutos<br>Tablas del 1 al 9</span>
                    </button>

                    <button class="game-card" data-game="lengua" type="button">
                        <span class="game-emoji">🔤</span>
                        <span class="game-name">¿Mayúscula o minúscula?</span>
                        <span class="game-desc">30 palabras en 2 minutos<br>Reglas del castellano</span>
                    </button>

                    <button class="game-card" data-game="english" type="button">
                        <span class="game-emoji">🇬🇧</span>
                        <span class="game-name">Fill the sentence</span>
                        <span class="game-desc">25 oraciones en 2:30<br>Inglés con dos huecos</span>
                    </button>
                </div>
            </div>
        </section>

        <!-- PANTALLA 2: JUEGO -->
        <section id="screen-game" class="screen">
            <header class="game-header">
                <div class="hud">
                    <div class="hud-item">
                        <span class="hud-label">Jugador</span>
                        <span id="hud-name" class="hud-value">—</span>
                    </div>
                    <div class="hud-item">
                        <span class="hud-label">Acertadas</span>
                        <span id="hud-score" class="hud-value">0 / 0</span>
                    </div>
                    <div class="hud-item">
                        <span class="hud-label">Tiempo</span>
                        <span id="hud-timer" class="hud-value timer">02:00</span>
                    </div>
                </div>
                <div class="progress-bar">
                    <div id="progress-fill" class="progress-fill"></div>
                </div>
            </header>

            <main class="question-area">
                <div id="feedback" class="feedback"></div>
                <div id="question" class="question" aria-live="polite">
                    <!-- generado por JS según el juego -->
                </div>

                <div class="keypad" id="keypad">
                    <!-- generado por JS según el juego -->
                </div>
            </main>
        </section>

        <!-- PANTALLA 3: RESULTADO -->
        <section id="screen-result" class="screen">
            <div class="card result-card">
                <h1 id="result-title" class="title">🎉</h1>
                <p id="result-message" class="result-message"></p>

                <div class="stats">
                    <div class="stat">
                        <span class="stat-label">Acertadas</span>
                        <span id="stat-correct" class="stat-value">0</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">Tiempo usado</span>
                        <span id="stat-time" class="stat-value">0s</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">Precisión</span>
                        <span id="stat-accuracy" class="stat-value">0%</span>
                    </div>
                </div>

                <div class="button-row">
                    <button id="btn-retry" class="btn btn-primary">Otra vez 🔁</button>
                    <button id="btn-menu" class="btn btn-secondary">Otro juego 🎮</button>
                    <button id="btn-home" class="btn btn-secondary">Cambiar jugador 👤</button>
                </div>
            </div>
        </section>

    </div>

    <canvas id="confetti" class="confetti"></canvas>

    <script src="script.js"></script>
</body>
</html>
